  quote: easy | 100.0% | 89.1% | 0.109 |
  url: https://huggingface.co/wfzyx/von-1.0/raw/5df8185a4f2327ad0a7cd117cc4f701ac557b9ae/README.md
disclosed_failure_modes: English only; not generative; near-chance on long multi-hop legal/policy reasoning,
  not for unsupervised high-stakes contract adjudication; calibration fitted on public benchmark data
  may drift on different domains
