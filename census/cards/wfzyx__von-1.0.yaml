  url: https://huggingface.co/wfzyx/von-1.0/raw/5df8185a4f2327ad0a7cd117cc4f701ac557b9ae/README.md
decision_head: 'Option-Marker head: every candidate option gets a [MASK] marker scored by a small head;
  in v1.2 an option''s tokens attend only to the shared premise and its own tokens, positions restart
  per option, making each option''s logit a function of (premise, that option) alone'
decision_head_src:
  quote: 'Each option

    gets a `[MASK]` marker whose final hidden state is scored by a small head.'
  url: https://huggingface.co/wfzyx/von-1.0/raw/5df8185a4f2327ad0a7cd117cc4f701ac557b9ae/README.md
training_objective: 1.2 was retrained from the 1.1 weights under the new order-invariant attention mask
  and recovers 1.1's accuracy on every public tier
training_objective_src:
  quote: '1.2 was retrained from the 1.1

