calibration_as_shipped: 'On JevBench public items (ece_top_label): easy tier accuracy 100.0%/ECE 0.109,
  standard 63.9%/ECE 0.045, hard 36.9%/ECE 0.089; map fitted in-sample on the 231 public items, split-half
  validation gives Calibration axis 67.6 vs in-sample 77.4'
