serving_temperature: T = 2.30, fitted on this checkpoint's in-distribution development rows by minimizing
  NLL; divides the pointer head's logits at inference by default
serving_temperature_src:
  quote: the built-in temperature (T = 2.30) fixes most of it without changing any answer
  url: https://huggingface.co/jaredpalmer/kev-9b/raw/2629c06a5aeb0feb3b9783bafed17ed8f39ecf5c/README.md
calibration_as_shipped: Out-of-domain ECE 0.106 raw -> 0.042 as served (T=2.30); confident errors out
  of domain fall from 8.7% raw to 4.0% as served
calibration_as_shipped_src:
  quote: out-of-domain ECE | 0.121 | 0.105 | 0.106 | **0.042** | 0.049 |
  url: https://huggingface.co/jaredpalmer/kev-9b/raw/2629c06a5aeb0feb3b9783bafed17ed8f39ecf5c/README.md
disclosed_failure_modes: Slow on Mac (no MPS kernel for DeltaNet, ~2s vs 0.3s on Kev-8B); knowledge gap
  vs Jev on MMLU/MMLU-Pro set by the base model; date arithmetic weak without the date_facts preprocessor;
  coverage at <=5% error 0.45-0.62 against Jev's 0.70
disclosed_failure_modes_src:
  quote: The DeltaNet kernels have no MPS implementation; PyTorch falls back to reference code
  url: https://huggingface.co/jaredpalmer/kev-9b/raw/2629c06a5aeb0feb3b9783bafed17ed8f39ecf5c/README.md
evaluation_protocol_published: Yes; development partitions select models, locked test partitions are read
  once per candidate, every number carries suite hash/code hashes/git commit in result.json
evaluation_protocol_published_src:
  quote: the locked test partition is read at most once per candidate (`runs/locked/kev-9b-night2-du-ungated/`
  url: https://huggingface.co/jaredpalmer/kev-9b/raw/2629c06a5aeb0feb3b9783bafed17ed8f39ecf5c/README.md
