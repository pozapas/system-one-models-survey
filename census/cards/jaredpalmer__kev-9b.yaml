backbone: Qwen/Qwen3.5-9B-Base, hybrid of 24 Gated DeltaNet (linear attention) layers and 8 full-attention
  layers
backbone_src:
  quote: 'Base model**: Qwen3.5-9B-Base, a hybrid of 24 Gated DeltaNet (linear attention) layers and 8
    full-attention layers'
  url: https://huggingface.co/jaredpalmer/kev-9b/raw/2629c06a5aeb0feb3b9783bafed17ed8f39ecf5c/README.md
parameter_count: LoRA adapter r=16, 45.4M trainable parameters, on Qwen3.5-9B-Base
parameter_count_src:
  quote: It is a LoRA adapter (r=16, 45.4M trainable parameters) plus a pointer head on `Qwen/Qwen3.5-9B-Base`
  url: https://huggingface.co/jaredpalmer/kev-9b/raw/2629c06a5aeb0feb3b9783bafed17ed8f39ecf5c/README.md
decision_head: Pointer head on top of the LoRA-adapted base; option letters/pointer read from the hidden
  state, no free-text generation
decision_head_src:
  quote: one document (the *state*) and a set of typed questions in, a probability distribution per question
    out, in one forward pass. No text generation.
  url: https://huggingface.co/jaredpalmer/kev-9b/raw/2629c06a5aeb0feb3b9783bafed17ed8f39ecf5c/README.md
training_objective: Cross-entropy on the option distribution, LoRA r=16 alpha=32, lr 5e-5 (OneCycle),
  plus a 15-minute delta fine-tune (lr 2e-5, one epoch) on additional date/abstention records
training_objective_src:
  quote: pointer head from scratch; cross-entropy on the option distribution; lr 5e-5 (OneCycle)
  url: https://huggingface.co/jaredpalmer/kev-9b/raw/2629c06a5aeb0feb3b9783bafed17ed8f39ecf5c/README.md
training_data: 'decision-v7: 10,000 public records (1,000 per source), 896 policy minimal-pair records,
  1,680 rule-structure records, plus a delta of 1,425 generated date/abstention records mixed with 2,000
  replayed records'
training_data_src:
  quote: 10,000 public records (1,000 per source), 896 policy minimal-pair records over nine template
    families, 1,680 records from 60 randomly generated rule structures in four rendering styles
  url: https://huggingface.co/jaredpalmer/kev-9b/raw/2629c06a5aeb0feb3b9783bafed17ed8f39ecf5c/README.md
