serving_temperature: not disclosed as a single shipped default
serving_temperature_src:
  quote: moves mean ECE **0.466 → 0.081** (`laya`) and **0.314 → 0.106** (`laya-multilingual`)
  url: https://huggingface.co/convaiinnovations/laya/raw/55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851/README.md
calibration_as_shipped: Raw ECE 0.314; refitting one temperature per (question type, option count) moves
  mean ECE to 0.106
calibration_as_shipped_src:
  quote: moves mean ECE **0.466 → 0.081** (`laya`) and **0.314 → 0.106** (`laya-multilingual`)
  url: https://huggingface.co/convaiinnovations/laya/raw/55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851/README.md
disclosed_failure_modes: Base checkpoint near chance zero-shot on typed-decisions (0.352 for multilingual);
  same option-token-budget and noul-label-token issues as the English checkpoint
disclosed_failure_modes_src:
  quote: 0.362 here and 0.352 for multilingual, against a 0.318 random and 0.461 majority-class baseline
  url: https://huggingface.co/convaiinnovations/laya/raw/55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851/README.md
evaluation_protocol_published: Yes; shared BENCHMARKS.md and in-card tables comparing routed/English/multilingual
  checkpoints
