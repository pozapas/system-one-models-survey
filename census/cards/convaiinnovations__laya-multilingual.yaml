backbone: mmBERT-base, 307M, bidirectional, 22 layers, hidden 768, 256k vocab -- not ModernBERT-large
backbone_src:
  quote: mmBERT-base (307M, bidirectional, 22 layers, hidden 768, 256k vocab) + a decision
  url: https://huggingface.co/convaiinnovations/laya-multilingual/raw/e4e9ddf21a7b1903b7acffd8814ad4307bf63a67/README.md
parameter_count: 322M total (safetensors.total 321,908,998)
parameter_count_src:
  quote: mmBERT-base | 322M | 1024 (up to 8,192) | 100+ languages, ~2x faster
  url: https://huggingface.co/convaiinnovations/laya-multilingual/raw/e4e9ddf21a7b1903b7acffd8814ad4307bf63a67/README.md
decision_head: 2 transformer layers, an option-marker scorer, and an act/escalate head, trained from scratch,
  same recipe as the English checkpoint
decision_head_src:
  quote: 2 transformer layers, an option-marker scorer, and an act/escalate head. 322M total.
  url: https://huggingface.co/convaiinnovations/laya-multilingual/raw/e4e9ddf21a7b1903b7acffd8814ad4307bf63a67/README.md
training_objective: RLCD, same recipe as the English Laya checkpoint (shared model family README)
training_objective_src:
  quote: the reward is a strictly proper scoring rule (log + spherical, plus ranked probability score
    for ordinal questions)
  url: https://huggingface.co/convaiinnovations/laya/raw/55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851/README.md
training_data: Not itemized by source/size beyond the shared RLCD family description
training_data_src:
  quote: RLCD (Reinforcement Learning for Calibrated Decisions)
  url: https://huggingface.co/convaiinnovations/laya/raw/55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851/README.md
primitives: choice, score, noul
primitives_src:
  quote: '"department": {"type": "choice", "instructions": "Which department should handle this?",'
  url: https://huggingface.co/convaiinnovations/laya/raw/55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851/README.md
state_modality: text in 100+ languages, up to 8,192 tokens
state_modality_src:
  quote: '`laya-multilingual` reads up to 8,192 tokens'
  url: https://huggingface.co/convaiinnovations/laya-multilingual/raw/e4e9ddf21a7b1903b7acffd8814ad4307bf63a67/README.md
context_length: 1024 tokens by default (head_max_len = 256); up to 8,192 with max_len=8192
context_length_src:
  quote: '**Budget** 1024 tokens per question, of which 256 go to the question and its options.'
  url: https://huggingface.co/convaiinnovations/laya-multilingual/raw/e4e9ddf21a7b1903b7acffd8814ad4307bf63a67/README.md
cardinality_limit: not disclosed as a fixed cap; same option-token-budget degradation pattern as the English
  checkpoint
cardinality_limit_src:
  quote: 77-option question like Banking77 allocates only `(256 - 16) // 77` ≈ 3–4 tokens per label
  url: https://huggingface.co/convaiinnovations/laya/raw/55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851/README.md
latency_with_hardware: 32.8 ms p50 for 1 question on a Tesla T4 GPU
latency_with_hardware_src:
  quote: '| 1 | 39.5 ms | **32.8 ms** |'
  url: https://huggingface.co/convaiinnovations/laya/raw/55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851/README.md
price: $0 self-hosted (open weights)
price_src:
  quote: 100% free
  url: https://huggingface.co/convaiinnovations/laya/raw/55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851/README.md
