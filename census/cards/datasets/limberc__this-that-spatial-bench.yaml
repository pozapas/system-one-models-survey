purpose: The benchmark named on the this-that-model 1.0/1.1 cards; spatial and logical two-option decision
  families, each label-balanced by construction
purpose_src:
  quote: spatial-reasoning
  url: https://huggingface.co/datasets/limberc/this-that-spatial-bench/raw/423c49f4ad2b8d200b38e845fdf046ba6b37d46b/README.md
size_and_splits: Multiple families with n items each, one test split; one family (stochastic) has a real
  probability target rather than a discrete label
size_and_splits_src:
  quote: Under a noisy actuator of stated reliability, will the executed move be safe?
  url: https://huggingface.co/datasets/limberc/this-that-spatial-bench/raw/423c49f4ad2b8d200b38e845fdf046ba6b37d46b/README.md
label_construction: Items are bucketed by answer and balanced by construction; one family's gold is a
  computed probability from a simulated actuator, not a human or teacher label
label_construction_src:
  quote: the true distribution over `options`. One-hot for the deterministic families
  url: https://huggingface.co/datasets/limberc/this-that-spatial-bench/raw/423c49f4ad2b8d200b38e845fdf046ba6b37d46b/README.md
