purpose: Typed-decision corpus for training a masked-diffusion LM (the LLaDA recipe, nanodiff-350m-base)
  to emit calibrated discrete decisions instead of text
purpose_src:
  quote: A typed-decision corpus for training a masked-diffusion LM to emit **calibrated
  url: https://huggingface.co/datasets/pngwn/typed-decisions/raw/ccc60827116873886f36baf3e9125a2ea91cce6b/README.md
size_and_splits: Synthetic and MMLU-Pro-derived examples assigned to splits by md5 hash of id; MMLU-Pro
  choice rows are a partition of its public test split only, so absolute accuracies are not comparable
  across studies
size_and_splits_src:
  quote: Synthetic and MMLU-Pro examples are assigned by an md5 hash of their id.
  url: https://huggingface.co/datasets/pngwn/typed-decisions/raw/ccc60827116873886f36baf3e9125a2ea91cce6b/README.md
label_construction: Gold severity label is the bucket of a latent draw, not the model's posterior; a v2
  companion corpus (pngwn/typed-decisions-v2) later fixed a disclosed synthetic-domain label/oracle inversion
  in v1
label_construction_src:
