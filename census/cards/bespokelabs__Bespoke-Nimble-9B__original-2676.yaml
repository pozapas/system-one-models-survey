# Curator resolution, 2026-09-24. This supersedes the calibration_as_shipped reading above.
curator_resolution:
  note: >-
    The GitHub README (bespokelabsai/nimble, main, accessed 2026-09-24) identifies the released
    original checkpoint as revision 93ec5d6ff1a9cd31d6cc0e0c58d312465d36de7c (tag original-2676). It
    reports 292/324 = 90.12% reference-label agreement against Jev 1.13.0 at 302/324 = 93.21%. It also
    states that the reference labels are synthetic and that the 324 items form 162 pairs from six source
    families. The HF evaluation_summary.json names this same checkpoint "Expanded-data 9B" (292/324).
    "Previous 9B" (83.95%) is an earlier internal checkpoint.
  calibration_as_shipped: >-
    Served at T=2.179 (fitted 2026-09-22). ECE, with ten groups by top probability: on the second set of
    300 examples it goes 0.128 -> 0.066; on the 324-item held-out set it goes 0.052 -> 0.054. On the 64
    rating questions it rises from 0.105 to 0.177.
  calibration_as_shipped_src: "Second set (300) | Expected calibration error | 0.128 | 0.066 ... Held-out set (324) | Expected calibration error | 0.052 | 0.054 -- https://github.com/bespokelabsai/nimble/blob/main/README.md"
  eval_src: "| **Bespoke-Nimble-9B** | **292/324** | **90.12%** | ... | Jev 1.13.0 | 302/324 | 93.21% | ... The reference labels are synthetic. -- https://github.com/bespokelabsai/nimble/blob/main/README.md"
