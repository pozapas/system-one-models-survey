decision_head: 248k-token LM head replaced by a 256-way slot head; options introduced by control tokens,
  hidden state at <|ts_answer|> projected to 256 logits, softmaxed; slot 255 is abstain
decision_head_src:
  quote: The 248k-token LM head is **replaced by a 256-way slot head**
  url: https://huggingface.co/iapp/OpenThai-SystemOne/raw/f3709948b5e3cc9606a57e74ba62b7a639d17dd3/README.md
training_objective: ~2-3M decision examples converted from public classification/NLI/QA/rating/agent/tool-selection
  datasets plus synthetic Thai/English decisions, then a calibration stage (Brier loss + per-type temperature)
training_objective_src:
  quote: then a short calibration stage (Brier loss + per-type temperature)
  url: https://huggingface.co/iapp/OpenThai-SystemOne/raw/f3709948b5e3cc9606a57e74ba62b7a639d17dd3/README.md
training_data: ~5B tokens continued Thai pretraining (web, Wikipedia, parallel Thai-English, machine-state
  text); ~2-3M decision examples converted from public datasets plus synthetic Thai/English decision tasks
