disclosed_failure_modes: Small model, recommends routing low-confidence cases to a bigger model or human;
  English calibration weaker than Thai (median ECE 0.15 vs ≤ 0.05); temperature scaling cannot fix sets
  where accuracy itself is low (wisesight, squad2, summeval-relevance)
disclosed_failure_modes_src:
  quote: 'English calibration is weaker than Thai (median ECE 0.15 vs ≤ 0.05): the training mix is Thai-heavy
    by design.'
  url: https://huggingface.co/iapp/OpenThai-SystemOne/raw/f3709948b5e3cc9606a57e74ba62b7a639d17dd3/README.md
evaluation_protocol_published: Yes; before/after calibration tables by dataset and type, a version history
