decision_head: 'Letter-logit readout: hidden state at each answer slot projected with the option-letter
  rows of the LM head and softmaxed over valid letters, divided by a stored temperature; no separate trained
  classification head'
decision_head_src:
  quote: The hidden state at each slot is projected with the option-letter rows of the LM head and softmaxed
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
training_objective: 'Supervised stages v1-v8: cross-entropy proper scoring rule on ~95 public decision
  datasets; RL stage v8-v10: PPO clipped surrogate + proper log score + rendering-consistency term + KL
  constraint to v8, no gold labels'
training_objective_src:
  quote: 384 optimizer steps at a peak learning rate of 1e-6 (cosine, 16 warm-up steps)
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
training_data: ~95 public decision datasets, agent trajectories (AgentGym), web element choice (Mind2Web),
  teacher-written custom questions, game states; RL stage adds live MiniWoB++, minesweeper and grid-game
  rollouts, no gold labels
training_data_src:
  quote: a mixture of about 95 public decision datasets, agent trajectories, web element choice, game
    states and teacher-written custom questions
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
primitives: noul, choice, score
primitives_src:
  quote: '* **noul**: probability of "yes".'
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
state_modality: string, object or array, up to 32k tokens with the questions
state_modality_src:
  quote: The state may be a string, object or array (up to 32k tokens with the questions)
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
context_length: up to 32k tokens (state plus questions)
context_length_src:
  quote: up to 32k tokens with the questions
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
cardinality_limit: 2 to 255 options per question; more than 10 options use one label token per option
cardinality_limit_src:
  quote: A question can have 2 to 255 options (more than 10 options use one label token per option
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
latency_with_hardware: 'On one NVIDIA B300 (decider-ai 1.2.1): 3.2 ms single request with CUDA graphs
  + torch.compile; 4 ms per request with CUDA graphs on one GPU per the family table; 134 ms p50 at 64
  concurrent HTTP clients (436 req/s)'
latency_with_hardware_src:
  quote: single request, CUDA graphs + torch.compile (helper default) | 3.2 ms |
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
