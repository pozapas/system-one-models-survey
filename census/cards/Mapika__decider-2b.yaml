confidence_definition: TypeSafe's definition, (n·x_p_max - 1)/(n - 1) for n options (choice); 1 minus
  the expected distance from the most likely level divided by the mean distance of the levels from scale
  middle, floored at 0 (score)
confidence_definition_src:
  quote: '`confidence` (TypeSafe''s definition, `(n·x_p_max − 1)/(n − 1)` for n options)'
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
probability_grid: not disclosed as a fixed discretization; probabilities are continuous per-option softmax
  outputs
probability_grid_src:
  quote: none found
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
serving_temperature: T = 1.30, the stored temperature for decider-2b v10 fitted on in-task data
serving_temperature_src:
  quote: 1.30 is the stored temperature
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
calibration_as_shipped: decider-2b v10, rebuilt-set in-task ECE 0.037 (67 tasks), held-out ECE 0.084 (28
  tasks), at T=1.30
calibration_as_shipped_src:
  quote: '**decider-2b v10 (this repository), rebuilt set, T=1.30** | 0.805 / 0.474 / 0.037 | 0.755 /
    0.622 / 0.084 |'
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
disclosed_failure_modes: Knowledge-heavy MMLU/MedQA/ARC improve little over the base model; English only;
  terse-bucket routing regressed vs v9 (59% vs 86% on held-out terse names); rules embedded in the question
  text are not followed; picking a record by array position is the least accurate input shape (0.51 vs
  0.70 by key); full label sets cost accuracy vs 10 sampled options; question order in packed rows changes
  up to 12% of answers; tweet_hate stays near chance
disclosed_failure_modes_src:
  quote: Rules written into the question ("fill if empty, otherwise skip") are not followed at this size
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
evaluation_protocol_published: Yes; 94 public tasks (69 in-task, 24-28 held-out), 15-bin ECE, per-task
  tables, live-browser and Bespoke-suite comparisons, GitHub reproduction scripts and per-version history
evaluation_protocol_published_src:
  quote: '**94 public tasks, original protocol.**'
  url: https://huggingface.co/Mapika/decider-2b/raw/d61c1c16089572df5d180329b9fea4997a90090c/README.md
