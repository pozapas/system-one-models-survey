decision_head: 基座 `Qwen/Qwen3-4B`，采用 AnyJev readout 提示词格式，LoRA 自蒸馏（只在答案 token 上算 loss）。
decision_head_src:
  quote: 基座 `Qwen/Qwen3-4B`，采用 AnyJev readout 提示词格式，LoRA 自蒸馏（只在答案 token 上算 loss）。
