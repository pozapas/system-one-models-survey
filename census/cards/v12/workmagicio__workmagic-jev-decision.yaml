training_objective: 用 AnyJev **自蒸馏**（self-distillation）得到的一次前向决策模型：把老师 `Decider(level=L0)` 在 **Slack 渠道流失（churn）** 决策上的答案蒸馏进单次前向读出；训练**无人工标签**。
training_objective_src:
  quote: 用 AnyJev **自蒸馏**（self-distillation）得到的一次前向决策模型：把老师 `Decider(level=L0)` 在 **Slack 渠道流失（churn）** 决策上的答案蒸馏进单次前向读出；训练**无人工标签**。
  url: 'https://huggingface.co/workmagicio/workmagic-jev-decision/raw/437f89034c27f794fefb858f952cd1f3dedd2558/README.md'
