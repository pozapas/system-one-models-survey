serving_temperature: 1.382, applied once by decide, then softmax over each question's valid options only
serving_temperature_src:
  quote: the temperature fitted on held-out calibration data (1.382 for this checkpoint).
  url: 'https://huggingface.co/perplexity-ai/pplx-decider-v1.2/raw/cce0f3f80033e9d89d80831d5281fd72124aacce/README.md'
calibration_as_shipped: 'Development set (1,497 questions): accuracy 91.3%, ECE 0.014, Brier 0.134; without temperature ECE 0.033, Brier 0.137'
calibration_as_shipped_src:
  quote: 'ECE 0.014 and Brier 0.134 (without temperature: ECE 0.033, Brier 0.137)'
  url: 'https://huggingface.co/perplexity-ai/pplx-decider-v1.2/raw/cce0f3f80033e9d89d80831d5281fd72124aacce/README.md'
disclosed_failure_modes: Probabilities remain somewhat over-confident on held-out decision datasets (ECE about 0.05); grouping independent candidates in one request can cost about 3 points
