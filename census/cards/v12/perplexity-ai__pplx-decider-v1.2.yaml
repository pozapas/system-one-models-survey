backbone: Qwen/Qwen3.8-27B (finetune), same backbone as v1.1
backbone_src:
  quote: on the same Qwen3.8-27B backbone.
  url: 'https://huggingface.co/perplexity-ai/pplx-decider-v1.2/raw/cce0f3f80033e9d89d80831d5281fd72124aacce/README.md'
parameter_count: 27B backbone; about 52 GiB of BF16 weights
parameter_count_src:
  quote: a CUDA GPU with room for about 52 GiB of BF16 weights plus working memory
  url: 'https://huggingface.co/perplexity-ai/pplx-decider-v1.2/raw/cce0f3f80033e9d89d80831d5281fd72124aacce/README.md'
decision_head: readout.safetensors BF16 [255, 5120] decision head; one readout per question at a marker token; noncausal full attention
decision_head_src:
  quote: Each question gets its own readout, at a marker token placed right after that question's options.
  url: 'https://huggingface.co/perplexity-ai/pplx-decider-v1.2/raw/cce0f3f80033e9d89d80831d5281fd72124aacce/README.md'
training_objective: not disclosed
training_objective_src:
  quote: none found
  url: 'https://huggingface.co/perplexity-ai/pplx-decider-v1.2/raw/cce0f3f80033e9d89d80831d5281fd72124aacce/README.md'
training_data: Reworked data, including official training splits of some Decision Index benchmarks (decontaminated) plus other decision data; several training runs combined by model souping
training_data_src:
  quote: It combines several training runs through model souping (weight averaging), chosen as the best compromise across all our evaluations rather than on any single benchmark.
  url: 'https://huggingface.co/perplexity-ai/pplx-decider-v1.2/raw/cce0f3f80033e9d89d80831d5281fd72124aacce/README.md'
state_modality: text and images (up to 1.6 MP)
state_modality_src:
  quote: This checkpoint handles both text and images (up to 1.6 MP).
  url: 'https://huggingface.co/perplexity-ai/pplx-decider-v1.2/raw/cce0f3f80033e9d89d80831d5281fd72124aacce/README.md'
context_length: max_length 262,144 tokens per sequence; training used sequences up to about 32k tokens
context_length_src:
  quote: '**Training used sequences up to about 32k tokens.**'
  url: 'https://huggingface.co/perplexity-ai/pplx-decider-v1.2/raw/cce0f3f80033e9d89d80831d5281fd72124aacce/README.md'
cardinality_limit: 1 to 255 options per question (2 to 255 for score)
cardinality_limit_src:
  quote: '**Options:** 1 to 255 per question (2 to 255 for `score`).'
  url: 'https://huggingface.co/perplexity-ai/pplx-decider-v1.2/raw/cce0f3f80033e9d89d80831d5281fd72124aacce/README.md'
latency_with_hardware: Throughput (requests/s) reported on one GB200; no per-request latency
