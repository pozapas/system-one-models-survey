primitives: choice, score, noul
primitives_src:
  quote: 中文优先的类型化决策模型（System One）：给定状态（文本 / JSON）和一个带选项的问题，一次前向计算输出每个选项的校准概率（choice / score / noul），不生成文本。检查点使用 Laya 的格式（决策头就是上游 `laya` 的模块），`jevzh compat` 已检查它能被 `laya` 参考运行时和 Laya 的 `/v1/systemone` 服务加载（Apple 芯片上另查 `laya-mlx`）。
  url: 'https://huggingface.co/TerryGao9/zh-decision-mmbert-v1b/raw/e4df2f88ef279362f629e9cd8a67ff60b81c28de/README.md'
