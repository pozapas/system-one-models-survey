disclosed_failure_modes: Base checkpoint near chance zero-shot on typed-decisions (0.362); Khmer collapses
  to 0.000 accuracy at 0.952 confidence; noul can follow its label tokens instead of the state; action.act_probability
  carries no usable signal (AUROC 0.30); high-cardinality choice questions lose accuracy under the default
  token budget
disclosed_failure_modes_src:
  quote: Khmer scores **0.000 accuracy at 0.952 confidence**
  url: https://huggingface.co/convaiinnovations/laya/raw/55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851/README.md
evaluation_protocol_published: Yes; BENCHMARKS.md on GitHub and a typed-decisions in-card table (400 cases,
