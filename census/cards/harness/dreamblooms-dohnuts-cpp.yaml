key_claims:
- excerpt: It runs the released Qwen3.5-0.8B base with the merged Dohnuts LoRA, scores candidate markers
    with the scalar decision head, and returns probabilities from a single forward pass.
  verbatim: true
- excerpt: The same binary also runs two related decision models, `decider-0.8b` and `kev-0.8b`, through
    profiles (see [Other decision models](#other-decision-models)).
  verbatim: true
- excerpt: 'Serve the model: ```sh build/dohnuts-cli --server --port 8080 \ --model work/dohnuts-Q8_0.gguf
    --head work/head.f32 \ --metadata models/dohnuts-0.1.0/dohnuts.json ``` Route a support request and
    check whether it asks for a refund'
  verbatim: true
