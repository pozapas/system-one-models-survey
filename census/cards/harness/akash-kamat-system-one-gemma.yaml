- Gemma 3 270M
- Gemma
key_claims:
- excerpt: 200x faster.
  verbatim: true
- excerpt: 200x cheaper.**  An open-source implementation of the **System One** scoring architecture,
    inspired by [TypeSafe.ai's Jev model](https://typesafe.ai) — the AI that famously [plays Doom in real-time](https://www.theregister.com/ai-and-ml/2026/09/16/typesafe-ai-debuts-model-for-machines-that-plays-doom/5296711).
  verbatim: true
- excerpt: I used **Google's Gemma 3 270M** — one of the smallest LLMs available (268M parameters) — because
    that's all I could run locally with no GPU.
  verbatim: true
