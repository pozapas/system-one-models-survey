what_it_does: Open-source Jev-style System One decision model. Gemma 3 270M with a scoring head — fast,
  calibrated decisions in a single forward pass. No text generation. Inspired by TypeSafe.ai's Jev.
primitives_supported:
- choice
- score
- noul
- noul (yes/no)
- binary
- extract
