key_claims:
- excerpt: 'Requirements: an Apple Silicon Mac, macOS 14+, and [uv](https://docs.astral.sh/uv/).'
  verbatim: true
- excerpt: '```bash git clone https://github.com/antonellof/laya-vs-dijkstra cd laya-vs-dijkstra uv run
    laya-vs-dijkstra ```  The first run downloads the `aac6fef/laya-multilingual-mlx` checkpoint (about
    650 MB) from Hugging Face once.'
  verbatim: true
- excerpt: '```bash uv run laya-vs-dijkstra --seeds 7,8,9 --kinds maze,rooms # more maps uv run laya-vs-dijkstra
    --width 61 --height 41 # bigger maps uv run laya-vs-dijkstra --optimize # MLX compile +'
  verbatim: true
