key_claims:
- excerpt: '```sh docker run -d --name laya-server --init --restart unless-stopped \ -p 8080:8080 \ -v
    laya-data:/data \ -e LAYA_ADMIN_USERNAME=admin \ -e LAYA_ADMIN_PASSWORD=''change-this-admin-password''
    \ 1panel/laya-server:latest ``` Replace the sample password with'
  verbatim: true
- excerpt: To use a domain name, configure HTTPS on a reverse proxy and forward requests to port 8080
    on the server.
  verbatim: true
- excerpt: '```sh curl -X POST http://YOUR_SERVER_IP:8080/v1/systemone \ -H ''Authorization: Bearer YOUR_API_KEY''
    \ -H ''Content-Type: application/json'' \ -d ''{"state":{"message":"I was charged twice"},"questions":{"refund":{"type":"noul","instructions":"Does
    the customer ask for a refund?"}}}'' ``` Successful responses'
  verbatim: true
