    does, so the same `handle_answer/3` clauses, thresholds, and telemetry apply whichever model answered.
  verbatim: true
- excerpt: '```elixir children = [ {Nx.Serving, serving: Jev.Nx.serving(Jev.Nx.Laya), name: MyApp.Laya,
    batch_size: 16} ] config :jev, backend: Jev.Nx config :jev_nx, serving: MyApp.Laya ``` Or per request,
    which is how a cascade'
  verbatim: true
- excerpt: 'On an Apple M5, servings warm, medians from `mix run bench/runtimes.exs` (Benchee, 10 seconds
