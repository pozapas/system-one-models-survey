key_claims:
- excerpt: '```bash pi install npm:@y0usaf/pi-jev ```  The extension needs an API key.'
  verbatim: true
- excerpt: All four go in one request, so a judgement costs one round trip of roughly 300 ms instead of
    four.
  verbatim: true
- excerpt: Every error path fails open.** A missing key, a timeout, a 429, or a malformed response produces
    no verdict and the tool call proceeds.
  verbatim: true
