key_claims:
- excerpt: Not affiliated with TypeSafe AI.** This is a hands-on study of the *parallel constrained decoding*
    idea behind [Jev](https://typesafe.ai/) — the "System One" model launched by Diogo Almeida's TypeSafe
    AI
  verbatim: true
- excerpt: 'The interesting claim: **a 1.5B model that cannot reliably write 28-field JSON can still make
    28 schema-valid decisions in ~0.4 s.** ``` [context + schema] ──► prefill (once) ──►'
  verbatim: true
- excerpt: 'field N       └───────────┴──── one batched forward pass ────────┘                           │               slice
    logits → softmax → pick value + probability ```  Engine: [`harshatheg/Qwen-2.5-1B-RLCD`](https://huggingface.co/harshatheg/Qwen-2.5-1B-RLCD)
    (Apache-2.0, cloned at setup, **not** vendored here).'
  verbatim: true
