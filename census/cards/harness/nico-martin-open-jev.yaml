what_it_does: 'open-jev is a browser-focused TypeScript library for typed decisions: one piece of text
  (the state) plus any number of typed questions go in, and one forward pass returns a calibrated probability
  distribution per question. Nothing is generated, so an answer'
primitives_supported:
- choice
- score
- noul
- noul (yes/no)
models_supported:
- Qwen3
- Qwen3-4B
- DeBERTa
