- choice
- score
- noul
models_supported:
- ModernBERT-large
key_claims:
- excerpt: 'The root checkpoint is Apache-2.0 and ungated, so no token is needed: ```sh mkdir -p models/laya-base/encoder
    models/laya-base/tokenizer B=https://huggingface.co/convaiinnovations/laya/resolve/main for f in model.safetensors
    encoder/config.json tokenizer/tokenizer.json \ tokenizer/tokenizer_config.json rl_agent_config.json;
    do curl'
  verbatim: true
- excerpt: '`typed-decisions/` is the fine-tuned one, marked `"fine_tuned": true` with temperatures near
    1.0 rather than near 2.0, and it is the sensible default for typed decisions.'
  verbatim: true
- excerpt: '```sh cargo build --release ./target/release/laya \ --state-file examples/ticket.txt \ --questions
    examples/questions.json ``` ```json { "model": "rl-agent", "answers": { "department": { "type": "choice",
    "choice": "billing", "probabilities": { "billing": 0.9641, "technical":'
  verbatim: true
