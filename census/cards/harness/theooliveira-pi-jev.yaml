what_it_does: Semantic tool routing and typed System One decisions for the Pi coding agent using TypeSafe
  Jev
primitives_supported:
- choice
- score
- noul
- noul (yes/no)
- binary
models_supported: []
key_claims:
- excerpt: '- **Automatic Mode (opt-in)**: `--jev-auto` / `PI_JEV_AUTO=1` / `/jev auto on` routes tools
    and suggests skills before every prompt.'
  verbatim: true
- excerpt: '- **Automatic Model Mode (opt-in)**: `--jev-auto-model` / `PI_JEV_AUTO_MODEL=1` / `/jev auto-model
    on` selects fast, balanced, reasoning, long-context, or vision models per prompt.'
  verbatim: true
- excerpt: '- **Tool Call Guard (opt-in)**: `--jev-tool-guard` / `PI_JEV_TOOL_GUARD=1` / `/jev tool-guard
    on` intercepts tool calls with Jev to detect hallucinations and enhance failed results.'
  verbatim: true
