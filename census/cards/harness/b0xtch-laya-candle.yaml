key_claims:
- excerpt: Use Rust 1.95 (pinned in `rust-toolchain.toml`) and a native C/C++ build toolchain.
  verbatim: true
- excerpt: 'Clone the source and run with CPU float32, the default backend: ```sh git clone https://github.com/b0xtch/laya-candle.git
    cd laya-candle cargo run --release -- predict \ --model convaiinnovations/laya \ --state-file examples/state.json
    --questions'
  verbatim: true
- excerpt: The final scorer and calibration remain float32, but reduced precision can change probabilities
    and close decisions.
  verbatim: true
